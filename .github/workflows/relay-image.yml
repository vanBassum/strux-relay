name: Relay image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/strux-relay

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A pull request builds but publishes nothing: the point there is to find
      # out whether it still compiles, and it has no business moving a tag.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # `main` is what a push to main moves, and `sha-<short>` is what you pin to
      # when you need to know exactly what is running.
      #
      # `latest` is deliberately NOT on that list: it moves only for a v* tag.
      # A deployment tracking `latest` would otherwise pick up whatever last
      # landed on main on its next pull — and right now that means trading a
      # relay that serves device UIs for one that does not yet. Cutting a tag is
      # the moment somebody decides the new image is ready to be the default.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # amd64 only — the server is x86_64, and arm64 would mean QEMU emulation for
      # a dotnet publish and a vite build, both of which are real work.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
